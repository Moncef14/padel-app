<div class="fermetures-page">
  <div class="page-header">
    <h1>Jours de fermeture</h1>
    <button mat-flat-button color="primary" (click)="ouvrirCreation()">
      Nouvelle fermeture
    </button>
  </div>

  @if (loading()) {
    <p class="loading-text">Chargement...</p>
  } @else {
    <table mat-table [dataSource]="fermetures()" class="fermetures-table">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let f">{{ f.date | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="portee">
        <th mat-header-cell *matHeaderCellDef>Portée</th>
        <td mat-cell *matCellDef="let f">
          <span class="badge" [class.badge-globale]="!f.site">
            {{ nomSite(f) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let f">
          <button mat-stroked-button color="warn" (click)="supprimer(f)">Supprimer</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
